name: Build and deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://test.readingmegagames.co.uk/
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Test generator
        run: npm test

      - name: Build staging site
        run: npm run build:staging

      - name: Validate generated site
        run: npm run check

      - name: Run Lighthouse performance budgets
        run: npm run lighthouse

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy staging
        uses: actions/deploy-pages@v4
        id: deployment
