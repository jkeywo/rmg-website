name: Build and deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://test.readingmegagames.co.uk/
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Test browser site
        run: npm test

      - name: Package staging site
        run: npm run package:staging

      - name: Validate site package
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count')
            if [ "$count" = "1" ]; then
              exit 0
            fi
            echo "Waiting for artifact metadata (attempt $attempt/12, found $count)."
            sleep 5
          done
          echo "::error::Expected exactly one artifact named $ARTIFACT_NAME."
          exit 1

      - name: Deploy staging
        uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
