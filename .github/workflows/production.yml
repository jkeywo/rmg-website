name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  manual-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://readingmegagames.co.uk/
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm production can fast-forward
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            git merge-base --is-ancestor origin/production HEAD
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Test browser site
        run: npm test

      - name: Package and validate production
        run: npm run package && npm run check

      - name: Deploy latest main to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=reading-megagames --branch=production
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance production branch
        shell: bash
        run: git push origin HEAD:production
